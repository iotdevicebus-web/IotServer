version: '3.8'

services:
  # ==========================================
  # IoT Management Server (mTLS + Web Dashboard)
  # ==========================================
  iot-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iot-platform-server
    restart: unless-stopped
    ports:
      - "8443:8443"  # mTLS エッジ通信エンドポイント
      - "8080:8080"  # 管理者 Web ダッシュボード & API
    volumes:
      # mTLS 証明書ディレクトリのマウント
      - ./tools/certs/out:/app/certs:ro
      # 時系列DB (SQLite) 永続化ボリューム
      - iot-sqlite-data:/app/data
    environment:
      - PORT=8443
      - REQUIRE_MTLS=true
      - SERVER_CERT=/app/certs/server.crt
      - SERVER_KEY=/app/certs/server.key
      - ROOT_CA_CERT=/app/certs/ca.crt
      - DB_DRIVER=sqlite
      - DB_DSN=/app/data/iot_platform.db
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==========================================
  # (Optional) PostgreSQL / TimescaleDB
  # ==========================================
  # postgres:
  #   image: timescale/timescaledb:latest-pg16
  #   container_name: iot-postgres-db
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_DB=iot_platform
  #     - POSTGRES_USER=iot_user
  #     - POSTGRES_PASSWORD=iot_secure_password
  #   volumes:
  #     - iot-pg-data:/var/lib/postgresql/data

volumes:
  iot-sqlite-data:
    driver: local
  # iot-pg-data:
  #   driver: local

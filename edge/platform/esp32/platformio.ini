; ========================================================
; PlatformIO Configuration for Freenove ESP32-S3 WROOM
; ========================================================

[platformio]
src_dir = .

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; シリアルモニター & ログファイル自動保存設定
monitor_speed = 115200
monitor_filters = 
    direct
    esp32_exception_decoder
    time        ; ログ行ごとにタイムスタンプを付与
    log2file    ; シリアル出力をファイルに自動記録 (.pio/logs/ または logs/ に保存)

build_flags = 
    -DESP32
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -I../../app/include
    -I../../osal/include
    -I../../hal/include
    -I../../middleware/serializer
    -I../../middleware/telemetry
    -I../../middleware/ota
    -I../../../tools/certs/out

build_src_filter = 
    +<*.cpp>
    +<*.c>
    +<../../middleware/serializer/protobuf_serializer.c>
    +<../../middleware/serializer/telemetry_serializer.c>
    +<../../middleware/telemetry/telemetry_buffer.c>

; ========================================================
; PlatformIO Configuration for Freenove ESP32-S3 WROOM (Root)
; ========================================================

[platformio]
src_dir = edge

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 8MB PSRAM (Octal/Quad SPI) & 8MB Flash 設定
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB

; シリアルモニター & ログファイル自動保存設定
monitor_speed = 115200
monitor_filters = 
    direct
    esp32_exception_decoder
    time        ; ログ行ごとにタイムスタンプを付与
    log2file    ; シリアル出力をファイルに自動記録 (.pio/logs/ または logs/ に保存)

lib_ldf_mode = deep+
lib_deps = 
    zinggjm/GxEPD2 @ ^1.5.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    tzapu/WiFiManager @ ^2.0.17



; UART0 (CH340/CP2102) & PSRAM 有効化設定
build_flags = 
    -DESP32
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Iedge/app/include


    -Iedge/osal/include
    -Iedge/hal/include
    -Iedge/middleware/serializer
    -Iedge/middleware/telemetry
    -Iedge/middleware/ota
    -Itools/certs/out

build_src_filter = 
    +<platform/esp32/main.cpp>
    +<platform/esp32/hal_esp32_network.c>
    +<platform/esp32/hal_esp32_sleep.c>
    +<platform/esp32/hal_esp32_epaper.cpp>
    +<middleware/serializer/protobuf_serializer.c>
    +<middleware/serializer/telemetry_serializer.c>
    +<middleware/telemetry/telemetry_buffer.c>

